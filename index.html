<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Oasis · Temas y juegos para el Y1</title>
<meta name="description" content="New Oasis: un launcher de aficionados, gratuito, para el Innioasis Y1. Temas que se instalan desde el propio Y1, minijuegos y guía de instalación.">
<meta property="og:title" content="New Oasis · tu Y1, a tu manera">
<meta property="og:description" content="Launcher gratuito de aficionados para el Innioasis Y1: temas, minijuegos, podcasts y más.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#17171C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap">
<script>
  // theme and language chosen by hand win over the browser's (saved per browser)
  (function () { try { const t = localStorage.getItem('no_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {} })();

<style>
  :root{--bg:#17171C;--panel:#212129;--panel2:#2A2A34;--line:#33333F;--text:#E8E8EE;--dim:#9A9AAA;--accent:#5FC4B4;--accent2:#45A99A;--on-accent:#0E1F1C;--ok:#81C784;--warn:#E0B060;--glow:rgba(95,196,180,.16)}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F5F7F6;--panel:#FFFFFF;--panel2:#ECF1EF;--line:#DCE3E0;--text:#1A1F1D;--dim:#5F6B67;--accent:#1F8A7A;--accent2:#176E61;--on-accent:#FFFFFF;--ok:#2E7D32;--warn:#9A6A00;--glow:rgba(31,138,122,.12)}}
  :root[data-theme="light"]{--bg:#F5F7F6;--panel:#FFFFFF;--panel2:#ECF1EF;--line:#DCE3E0;--text:#1A1F1D;--dim:#5F6B67;--accent:#1F8A7A;--accent2:#176E61;--on-accent:#FFFFFF;--ok:#2E7D32;--warn:#9A6A00;--glow:rgba(31,138,122,.12)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Segoe UI','Roboto',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
  a{color:var(--accent)}
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;white-space:nowrap;color:var(--text);text-decoration:none}
  .brand svg{width:26px;height:26px}
  .top nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .top nav::-webkit-scrollbar{display:none}
  .top nav a{padding:7px 11px;border-radius:9px;color:var(--dim);text-decoration:none;font-weight:500;white-space:nowrap}
  .top nav a:hover{background:var(--panel2);color:var(--text)}
  .tools{display:flex;gap:6px}
  .tools button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:5px 9px;cursor:pointer;min-width:36px}
  .tools button:hover{border-color:var(--accent)}
  main{max-width:1080px;margin:0 auto;padding:0 20px 70px}
  /* hero: text + a Y1 drawn with CSS */
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding:46px 0 22px}
  .hero h1{margin:0 0 12px;font-size:clamp(30px,5.2vw,46px);line-height:1.08;letter-spacing:-.015em}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p{margin:0;color:var(--dim);max-width:600px;font-size:16.5px}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--panel2);color:var(--dim);margin-bottom:14px}
  .device{justify-self:center;width:min(300px,100%);background:linear-gradient(160deg,#2E2E35,#1C1C21);border-radius:34px;padding:18px 18px 24px;box-shadow:0 30px 60px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.05) inset,0 0 80px var(--glow)}
  .device .scr{box-shadow:0 0 0 4px #000}
  .wheel{width:58%;aspect-ratio:1;margin:20px auto 0;border-radius:50%;background:#3A3A43;position:relative;display:grid;place-items:center;font:700 10px 'Segoe UI',system-ui,sans-serif;color:#C9C9D2}
  .wheel::after{content:"";width:40%;aspect-ratio:1;border-radius:50%;background:#26262C;box-shadow:0 0 0 1px #4A4A55}
  .wheel span{position:absolute}
  .wheel .t{top:9%}.wheel .b{bottom:9%}.wheel .l{left:10%}.wheel .r{right:10%}
  h2{font-size:24px;margin:48px 0 4px;scroll-margin-top:70px}
  .sub{color:var(--dim);margin:0 0 18px}
  .feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .feat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  .feat .ic{font-size:24px;line-height:1}
  .feat h3{margin:8px 0 4px;font-size:16px}
  .feat p{margin:0;color:var(--dim);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
  .card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card h3{margin:0;font-size:18px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--dim)}
  .tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
  .card p{margin:0;color:var(--dim);font-size:14px}
  .row{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:11px;border:1px solid transparent;background:var(--accent);color:var(--on-accent);text-decoration:none;cursor:pointer}
  .btn:hover{background:var(--accent2)}
  .btn.alt{background:var(--panel);color:var(--text);border-color:var(--line)}
  .btn.alt:hover{border-color:var(--accent)}
  .size{color:var(--dim);font-size:13px}
  /* a Y1 screen drawn with a theme's colours (no album art: just a note) */
  .shot{padding:18px;background:linear-gradient(160deg,#2E2E35,#1E1E23)}
  .scr{aspect-ratio:4/3;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 5px #000,0 0 0 6px #3A3A42;font-size:clamp(8px,2vw,13px)}
  .device .scr{font-size:clamp(7px,1.6vw,9.5px)}
  .scr .bar{display:flex;justify-content:space-between;padding:.25em .6em;font-size:.85em}
  .scr .main{flex:1;display:flex;gap:.5em;padding:0 .4em .5em}
  .scr ul{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;gap:.12em}
  .scr li{padding:.12em .45em;border-radius:.45em;display:flex;justify-content:space-between;font-size:1.12em;line-height:1.35}
  .scr .side{flex:1;border-radius:.8em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;margin-top:.3em}
  .scr .clock{font-size:2.3em;font-weight:700;line-height:1}
  .scr .line{width:2.2em;height:.18em;border-radius:1em}
  .scr .art{width:42%;aspect-ratio:1;border-radius:.3em;display:grid;place-items:center;font-size:2em;opacity:.85}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .game{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
  .game:hover{border-color:var(--accent);transform:translateY(-1px)}
  .game .em{font-size:28px;line-height:1.1}
  .game b{display:block}
  .game p{margin:3px 0 6px;color:var(--dim);font-size:13.5px;line-height:1.45}
  .game small{font-size:12px;font-weight:600;color:var(--accent)}
  .game small.need{color:var(--warn)}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
  .steps .card{padding:18px}
  .steps h3{margin:0 0 8px;font-size:16px}
  .steps ol,.steps ul{margin:0;padding-left:20px;color:var(--dim)}
  .steps li{margin:5px 0}
  .steps b{color:var(--text)}
  .note{font-size:13.5px;color:var(--dim);margin:10px 0 0}
  code{font-family:Consolas,'Cascadia Mono',monospace;font-size:.92em;background:var(--panel2);padding:1px 5px;border-radius:5px;color:var(--text)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  th{color:var(--dim);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
  .st-ok{color:var(--ok);font-weight:600}.st-wait{color:var(--warn);font-weight:600}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 8px;overflow-x:auto}
  .faq details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 10px}
  .faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+";color:var(--accent);font-weight:700}
  .faq details[open] summary::after{content:"−"}
  .faq p{margin:8px 0 2px;color:var(--dim)}
  .news{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .news h3{margin:0 0 6px;font-size:16px}
  .news ul{margin:0;padding-left:20px;color:var(--dim)}
  .news li{margin:4px 0}
  footer{max-width:1080px;margin:0 auto;padding:26px 20px 50px;color:var(--dim);font-size:13px;border-top:1px solid var(--line);display:grid;gap:10px}
  footer p{margin:0}
  .err{color:#E57373}
  @media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:28px}.device{width:min(260px,80%)}}
  @media (max-width:600px){.top{padding:0 12px;gap:8px}.top nav{display:none}main{padding:0 14px 60px}}
</style>
</head>

</footer>

const tr = k => (I[k] || [k, k])[L];
const pick = (es, en) => ES ? es : en;
document.documentElement.lang = ES ? 'es' : 'en';
document.querySelectorAll('[data-i]').forEach(el => el.textContent = tr(el.dataset.i));
document.querySelectorAll('[data-i-html]').forEach(el => el.innerHTML = tr(el.dataset.iHtml));

const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches; };
const paintThemeBtn = () => { themeBtn.textContent = isDark() ? '☀' : '☾'; themeBtn.title = pick(isDark() ? 'Modo claro' : 'Modo oscuro', isDark() ? 'Light mode' : 'Dark mode'); };

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

function screen(c) { // the New Oasis main menu in a theme's colours

  scr.style.fontFamily = c.font === 'serif' ? "'Noto Serif','Droid Serif',Georgia,serif" : "'Segoe UI',Roboto,system-ui,sans-serif";
  const hhmm = new Date().toLocaleTimeString(ES ? 'es-ES' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
  const bar = el('div', 'bar'); bar.style.background = c.bar; bar.append(el('span', null, pick('Menú principal', 'Main Menu')), el('span', null, '▮ 57 %'));
  const main = el('div', 'main'), ul = el('ul');
  pick(['Reproduciendo', 'Música', 'Vídeos', 'Podcasts', 'Radio FM', 'Bluetooth', 'Extras', 'Ajustes'],
       ['Now Playing', 'Music', 'Videos', 'Podcasts', 'FM Radio', 'Bluetooth', 'Extras', 'Settings'])
    .forEach((s, i) => { const li = el('li'); li.append(el('span', null, s)); if (i === 0) { li.style.background = c.accent; li.style.color = '#fff'; li.append(el('span', null, '›')); } ul.append(li); });
  const side = el('div', 'side'); side.style.background = `color-mix(in srgb, ${c.text} 7%, transparent)`;
  const line = el('div', 'line'); line.style.background = c.accent;
  const art = el('div', 'art', '♪'); art.style.background = `color-mix(in srgb, ${c.accent} 22%, transparent)`; art.style.color = c.accent;
  side.append(el('div', 'clock', hhmm), line, art);
  main.append(ul, side); scr.append(bar, main);
  return scr;
}

function themeCard(th) {
  const card = el('article', 'card'), shot = el('div', 'shot');
  shot.append(screen(th.colors || { bg: '#222', bar: '#111', text: '#eee', text2: '#999', accent: '#5FC4B4' })); card.append(shot);
  const body = el('div', 'body'); body.append(el('h3', null, th.title || th.name));
  const tags = el('div', 'tags');
  if (th.variant) tags.append(el('span', 'tag', loc(th.variant)));
  if (th.unofficial) tags.append(el('span', 'tag warn', pick('No oficial', 'Unofficial')));
  tags.append(el('span', 'tag', pick('Versión ', 'Version ') + th.version));
  body.append(tags, el('p', null, loc(th.description)));
  const row = el('div', 'row'), dl = el('a', 'btn', '⬇ ' + pick('Descargar .zip', 'Download .zip'));
  dl.href = th.file; dl.download = th.name + '.zip';
  row.append(dl, el('span', 'size', kb(th.size) + ' · ' + pick('en el Y1: «' + th.name + '»', 'on the Y1: "' + th.name + '"')));
  body.append(row); card.append(body);
  return card;
}

function gameCard(g) {
  const a = el('a', 'game'); a.href = 'games/#' + g.id;
  const txt = el('div'); txt.append(el('b', null, loc(g.name)), el('p', null, loc(g.description)));
  txt.append(el('small', g.music ? 'need' : null, g.music ? pick('🎵 Necesita tu Y1', '🎵 Needs your Y1') : pick('▶ Jugar en el navegador', '▶ Play in the browser')));
  a.append(el('span', 'em', g.emoji || '🎮'), txt);
  return a;
}
