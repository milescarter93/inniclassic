<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y1 · Last.fm</title>
<style>
  body{margin:0;font-family:'Segoe UI','Roboto',system-ui,sans-serif;background:#17171C;color:#E8E8EE;font-size:14px}
  a{color:#B39DDB;text-decoration:none}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;background:#1C1C23;border-bottom:1px solid #33333F}
  .brand{font-weight:700;font-size:17px;white-space:nowrap}
  .brand{color:inherit;text-decoration:none}
  .brand span{color:#B39DDB}
  .nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 12px;border-radius:9px;color:#9A9AAA;white-space:nowrap;font-weight:500}
  .nav a:hover,.nav a.on{background:#2A2A34;color:#E8E8EE}
  .page{max-width:480px;margin:0 auto;padding:28px 20px 60px}
  h2{margin:0 0 6px;font-weight:600}
  .note{color:#9A9AAA;margin:0 0 18px}
  .box{background:#212129;padding:20px;border-radius:16px;margin:0 0 14px}
  input{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;margin:6px 0;border-radius:10px;border:1px solid transparent;background:#2A2A34;color:#E8E8EE;outline:none}
  input:focus{border-color:#B39DDB}
  button{width:100%;font:inherit;padding:11px;margin:6px 0;border-radius:10px;border:none;background:#B39DDB;color:#16121F;font-weight:600;cursor:pointer}
  button:hover{background:#9575CD}
  button.alt{background:#2A2A34;color:#E8E8EE}
  button.danger{background:#2A2A34;color:#E57373}
  #msg{margin-top:8px;font-weight:600}
  @media (max-width:760px){.top{padding:0 12px;gap:10px;height:52px}.page{padding:18px 12px 60px}}
</style>
</head>
<body>
<div id="i18n" hidden
  data-loggedas="{{Logged in as %s}}" data-on="{{Scrobbling is on}}" data-off="{{Scrobbling is off}}"
  data-turnon="{{Turn Scrobbling On}}" data-turnoff="{{Turn Scrobbling Off}}" data-logout="{{Log Out}}"
  data-notlogged="{{Not logged in to Last.fm.}}" data-fill="{{Please fill in both fields.}}"
  data-logging="{{Logging in...}}"></div>
<div class="top"><a class="brand" href="/"><svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true" style="vertical-align:-6px;margin-right:7px"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".35"/><circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".35"/><path d="M16 4.5c4.6 4.4 6.6 7.9 6.6 10.6a6.6 6.6 0 0 1-13.2 0c0-2.7 2-6.2 6.6-10.6z" fill="#5FC4B4"/></svg>New <span>Oasis</span></a><nav class="nav">
  <a href="/">📁 {{Files}}</a><a href="/library">📚 {{Library & Playlists}}</a>
  <a href="/media">🎙️ {{Podcasts & Audiobooks}}</a><a class="on" href="/lastfm">🎧 Last.fm</a><a href="/games">🎮 {{Games}}</a></nav></div>
<div class="page">
  <h2>🎧 Last.fm</h2>
  <p class="note">{{Send the songs you listen to on the Y1 to your Last.fm profile.}}</p>
  <div class="box" id="statusBox">…</div>
  <div class="box" id="loginBox" style="display:none">
    <input id="u" type="text" placeholder="{{Last.fm username}}" autocapitalize="off" autocorrect="off">
    <input id="p" type="password" placeholder="{{Last.fm password}}" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">{{Log In}}</button>
    <div id="msg"></div>
  </div>
</div>
<script>
const T=document.getElementById('i18n').dataset, $=id=>document.getElementById(id);
function refreshStatus(){
  fetch('/api/lastfm/status').then(r=>r.json()).then(s=>{
    const box=$('statusBox');
    if(s.loggedIn){
      box.innerHTML='<p id="who"></p><p id="state" style="color:#9A9AAA"></p>'
        +'<button class="alt" id="toggle"></button><button class="danger" onclick="doLogout()"></button>';
      $('who').textContent=T.loggedas.replace('%s','@'+s.username);
      $('state').textContent=s.enabled?T.on:T.off;
      $('toggle').textContent=s.enabled?T.turnoff:T.turnon;
      $('toggle').onclick=()=>setEnabled(!s.enabled);
      box.querySelector('.danger').textContent=T.logout;
      $('loginBox').style.display='none';
    }else{
      box.textContent=T.notlogged;
      $('loginBox').style.display='block';
    }
  });
}
function doLogin(){
  const u=$('u').value.trim(), p=$('p').value, msg=$('msg');
  if(!u||!p){msg.style.color='#E57373';msg.textContent=T.fill;return;}
  msg.style.color='#B39DDB';msg.textContent=T.logging;
  fetch('/api/lastfm/login',{method:'POST',body:'username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p)})
    .then(r=>r.json()).then(res=>{
      if(res.success){msg.style.color='#81C784';msg.textContent='✓ @'+res.message;$('p').value='';refreshStatus();}
      else{msg.style.color='#E57373';msg.textContent='✕ '+res.message;}
    });
}
function doLogout(){fetch('/api/lastfm/logout',{method:'POST'}).then(refreshStatus);}
function setEnabled(v){fetch('/api/lastfm/enabled?value='+v,{method:'POST'}).then(refreshStatus);}
refreshStatus();
</script>
</body>
</html>
