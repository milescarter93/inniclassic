<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y1 · Juegos</title>
<style>
  :root{--bg:#17171C;--panel:#212129;--panel2:#2A2A34;--line:#33333F;--text:#E8E8EE;--dim:#9A9AAA;--accent:#B39DDB}
  html,body{height:100%}
  body{margin:0;font-family:'Segoe UI','Roboto',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  a{color:var(--accent);text-decoration:none}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;background:#1C1C23;border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:17px;white-space:nowrap}
  .brand span{color:var(--accent)}
  .nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav[hidden]{display:none}
  .nav a{padding:8px 12px;border-radius:9px;color:var(--dim);white-space:nowrap;font-weight:500}
  .nav a:hover,.nav a.on{background:var(--panel2);color:var(--text)}
  .page{max-width:1100px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:minmax(0,520px) minmax(280px,1fr);gap:28px;align-items:start}
  .dev{width:100%;min-width:0}
  /* the Y1 */
  .y1{width:100%;box-sizing:border-box;background:linear-gradient(160deg,#2E2E35,#1E1E23);border-radius:34px;padding:20px 20px 28px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
  .screen{background:#000;border-radius:10px;padding:6px;box-shadow:inset 0 0 0 1px #000,0 0 0 1px #3A3A42}
  canvas{display:block;width:100%;aspect-ratio:4/3;border-radius:4px;touch-action:manipulation;cursor:pointer}
  .wheelbox{display:flex;justify-content:center;margin-top:22px}
  svg.wheel{width:250px;max-width:70%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
  .wheel .ring{fill:#3A3A43;cursor:grab}
  .wheel .ring.drag{cursor:grabbing}
  .wheel .lbl{fill:#C9C9D2;font:700 15px 'Segoe UI',system-ui,sans-serif;pointer-events:none}
  .wheel .ico{fill:#C9C9D2;pointer-events:none}
  .wheel .center{fill:#26262C;stroke:#4A4A55;stroke-width:1.5;cursor:pointer}
  .wheel .hit{fill:rgba(255,255,255,.10);pointer-events:none;opacity:0;transition:opacity .12s}
  .wheel .hit.on{opacity:1}
  /* side panel */
  h2{margin:0 0 4px;font-size:22px;font-weight:600}
  .note{color:var(--dim);margin:0 0 18px;line-height:1.5}
  .box{background:var(--panel);border-radius:16px;padding:16px 18px;margin:0 0 14px}
  .box h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .games button{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:var(--text);background:var(--panel2);border:1px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
  .games button:hover{border-color:var(--line)}
  .games button.on{border-color:var(--accent)}
  .games .em{font-size:20px}
  .games small{display:block;color:var(--dim);font-size:12px;margin-top:1px}
  table.keys{width:100%;border-collapse:collapse}
  .keys td{padding:5px 0;vertical-align:top}
  .keys td:first-child{width:46%;color:var(--dim)}
  kbd{display:inline-block;min-width:16px;text-align:center;font:600 12px 'Segoe UI',system-ui,sans-serif;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;margin:1px 2px 1px 0;color:var(--text)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0}
  select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
  label.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
  .musicnote{color:var(--dim);font-size:13px;line-height:1.5;margin:8px 0 0}
  .musicnote.ok{color:#81C784}
  @media (max-width:900px){.page{grid-template-columns:minmax(0,1fr);justify-items:center}.dev,.side{width:100%;max-width:520px}}
  @media (max-width:760px){.top{padding:0 12px;gap:10px;height:52px}.page{padding:14px 12px 60px}.y1{padding:12px 12px 20px;border-radius:24px}}
</style>
</head>
<body>
<div class="top"><div class="brand">Y1 <span>InniClassic</span></div><nav class="nav" id="nav" hidden>
  <a href="/" data-t="Files">📁 Files</a><a href="/library" data-t="Library & Playlists">📚 Library & Playlists</a>
  <a href="/media" data-t="Podcasts & Audiobooks">🎙️ Podcasts & Audiobooks</a><a href="/lastfm">🎧 Last.fm</a>
  <a class="on" href="/games" data-t="Games">🎮 Games</a></nav></div>
<div class="page">
  <div class="dev">
    <div class="y1">
      <div class="screen"><canvas id="cv" width="480" height="360" aria-label="Y1"></canvas></div>
      <div class="wheelbox">
        <svg class="wheel" id="wheel" viewBox="0 0 260 260" aria-label="Click wheel">
          <circle class="ring" id="ring" cx="130" cy="130" r="126"/>
          <path class="hit" id="hit"/>
          <text class="lbl" x="130" y="36" text-anchor="middle" data-t="MENU">MENU</text>
          <g class="ico" transform="translate(222,130)"><path d="M-12,-8 L-2,0 L-12,8Z M-3,-8 L7,0 L-3,8Z"/><rect x="7" y="-8" width="3" height="16"/></g>
          <g class="ico" transform="translate(38,130)"><path d="M12,-8 L2,0 L12,8Z M3,-8 L-7,0 L3,8Z"/><rect x="-10" y="-8" width="3" height="16"/></g>
          <g class="ico" transform="translate(130,222)"><path d="M-11,-8 L-2,0 L-11,8Z"/><rect x="1" y="-8" width="3" height="16"/><rect x="7" y="-8" width="3" height="16"/></g>
          <circle class="center" id="centerBtn" cx="130" cy="130" r="46"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="side">
    <h2 data-t="Games">Games</h2>
    <p class="note" id="intro"></p>
    <div class="box"><div class="games" id="list"></div>
      <p class="musicnote" id="musicNote"></p></div>
    <div class="box"><h3 data-t="Controls">Controls</h3><table class="keys" id="keys"></table></div>
    <div class="box"><h3 data-t="Options">Options</h3>
      <div class="row"><span data-t="Colours">Colours</span><select id="palette"></select></div>
      <div class="row"><label class="chk"><input type="checkbox" id="sound" checked> <span data-t="Click sound">Click sound</span></label></div>
    </div>
  </div>
</div>
<script>
'use strict';
// ───────────────────────── language ─────────────────────────
// The same English keys as the Y1 app (assets/languages/spanish.json), so the wording matches the device.
const ES = {
  "Games":"Juegos","Music Quiz":"Quiz musical","Bricks":"Ladrillos","Snake":"Serpiente","Simon":"Simón","Blocks":"Bloques","Flappy":"Flappy",
  "Which Came First?":"¿Cuál salió antes?","Paused":"En pausa","Center: resume":"Central: seguir","Back: leave":"Atrás: salir",
  "Game Over":"Fin de la partida","Score: %d":"Puntos: %d","New record!":"¡Nuevo récord!","Best: %d":"Récord: %d",
  "Center: play again":"Central: jugar otra vez","Center: start":"Central: iniciar","Wheel: move the paddle":"Rueda: mover la pala",
  "Center: launch the ball":"Central: lanzar la bola","Level %d":"Nivel %d","Wheel: turn left / right":"Rueda: girar a izquierda o derecha",
  "Eat to grow; avoid the walls and yourself.":"Come para crecer; no choques con las paredes ni contigo.",
  "Watch the sequence, then repeat it":"Mira la secuencia y repítela","with Previous, Next, Play/Pause and Center.":"con Retroceder, Adelante, Reproducir/Pausa y Central.",
  "Watch...":"Mira...","Your turn":"Tu turno","Round %d":"Ronda %d","MENU":"MENÚ","Wheel: move  ·  Center: turn":"Rueda: mover  ·  Central: girar",
  "Next: drop  ·  Play/Pause: down":"Adelante: soltar  ·  Reproducir/Pausa: bajar","Next":"Siguiente","Score":"Puntos","Lines":"Líneas","Level":"Nivel","Best":"Récord",
  "Center: flap":"Central: aletear","Fly through the gaps between the pipes.":"Pasa volando por los huecos entre los tubos.",
  "Which song came out first?":"¿Qué canción salió antes?","Wheel: choose  ·  Center: answer":"Rueda: elegir  ·  Central: responder",
  "Your songs need a year in their tags to play this.":"Para jugar, tus canciones necesitan el año en las etiquetas.",
  "Right!":"¡Correcto!","Wrong!":"¡Fallo!","Which one came out first?":"¿Cuál salió antes?",
  "Which artist released %s?":"¿Qué artista publicó %s?","Which album is %s from?":"¿De qué álbum es %s?","What year was %s released?":"¿En qué año se publicó %s?",
  "What genre is %s?":"¿De qué género es %s?","Which cover matches this song's album?":"¿Qué portada es la del álbum de esta canción?",
  "What song is playing?":"¿Qué canción está sonando?","Correct!":"¡Correcto!","It was: ":"Era: ","Round %d Complete!":"¡Ronda %d completada!",
  "Not enough songs in your library for Music Quiz.":"No hay suficientes canciones en tu biblioteca para el Quiz musical.",
  "You beat all 5 rounds!":"¡Has superado las 5 rondas!","Game Over!":"¡Fin del juego!","Continue":"Continuar",
  "Files":"Archivos","Library & Playlists":"Biblioteca y listas","Podcasts & Audiobooks":"Podcasts y audiolibros",
  // only on this page
  "Controls":"Controles","Options":"Opciones","Colours":"Colores","Click sound":"Sonido de clic",
  "Listen to the clip and pick the answer":"Escucha el fragmento y elige la respuesta","5 rounds of 8 questions, 3 lives.":"5 rondas de 8 preguntas, 3 vidas.",
  "Open this page from the Y1's web server to play with your music.":"Abre esta página desde el servidor web del Y1 para jugar con tu música.",
  "Loading your music...":"Cargando tu música...","Playing with your Y1's music (%d songs).":"Jugando con la música de tu Y1 (%d canciones).",
  "The music games use your Y1's songs: open this page from its web server.":"Los juegos de música usan las canciones de tu Y1: abre esta página desde su servidor web.",
  "Couldn't load the Y1's library.":"No se pudo cargar la biblioteca del Y1.",
  "Web versions of InniClassic's mini-games, to try them on the computer. They play like on the Y1: same rules, same buttons.":
    "Versiones web de los minijuegos de InniClassic para probarlos en el ordenador. Se juegan como en el Y1: mismas reglas, mismos botones.",
  "Wheel":"Rueda","Center button":"Botón central","Back (MENU)":"Atrás (MENÚ)","Previous":"Retroceder","Play/Pause":"Reproducir/Pausa",
  "or spin the wheel / mouse wheel":"o gira la rueda / rueda del ratón","or click the screen":"o haz clic en la pantalla",
  "Dark":"Oscuro","Claude (dark)":"Claude (oscuro)","Claude (light)":"Claude (claro)","iPod (light)":"iPod (claro)",
  "Loading...":"Cargando...","Record":"Récord","Choose a game with the wheel":"Elige un juego con la rueda"
};
const LANG_ES = /^es\b/i.test(navigator.language || 'es');
const t = s => (LANG_ES && ES[s]) || s;
const fmt = (s, ...a) => { let i = 0; return t(s).replace(/%[ds]/g, () => a[i++]); };

// ───────────────────────── storage (best scores, options) ─────────────────────────
const store = {
  get(k, d) { try { const v = localStorage.getItem('y1games_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('y1games_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ───────────────────────── palettes (the game's theme colours) ─────────────────────────
const SANS = "'Segoe UI','Roboto',system-ui,sans-serif", SERIF = "'Droid Serif',Georgia,'Times New Roman',serif";
const PALETTES = {
  dark:   { name: 'Dark',          bg: '#1E1E22', text: '#F2F2F7', text2: '#98989D', accent: '#2588DC', font: SANS },
  claude: { name: 'Claude (dark)', bg: '#262624', text: '#F5F4EE', text2: '#A6A39A', accent: '#C6613F', font: SERIF },
  cream:  { name: 'Claude (light)',bg: '#F5F4EE', text: '#2B2A27', text2: '#7A776E', accent: '#C6613F', font: SERIF },
  ipod:   { name: 'iPod (light)',  bg: '#FFFFFF', text: '#111111', text2: '#6D6D72', accent: '#2F7BE0', font: SANS }
};
let P = PALETTES[store.get('palette', 'dark')] || PALETTES.dark;

// ───────────────────────── canvas ─────────────────────────
const W = 480, H = 360;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function fitCanvas() {
  const k = Math.max(1, Math.min(3, (cv.clientWidth / W) * (window.devicePixelRatio || 1)));
  if (cv.width !== Math.round(W * k)) { cv.width = Math.round(W * k); cv.height = Math.round(H * k); }
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
const font = (size, bold) => (bold ? '700 ' : '400 ') + size + 'px ' + P.font;
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function fillRR(l, t_, r, b, rad, col) { ctx.fillStyle = col; rr(l, t_, r - l, b - t_, Math.max(0, Math.min(rad, (r - l) / 2, (b - t_) / 2))); ctx.fill(); }
function circle(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function txt(s, x, y, size, col, bold, align) { ctx.font = font(size, bold); ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function ellipsize(s, size, bold, max) {
  ctx.font = font(size, bold); s = s || '';
  if (ctx.measureText(s).width <= max) return s;
  while (s.length > 1 && ctx.measureText(s + '…').width > max) s = s.slice(0, -1);
  return s + '…';
}
function hsv(h, s, v) { // → css colour
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return `rgb(${Math.round(f(5) * 255)},${Math.round(f(3) * 255)},${Math.round(f(1) * 255)})`;
}
function alpha(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ───────────────────────── keys (the Y1's Android key codes) ─────────────────────────
const K = { LEFT: 21, RIGHT: 22, CENTER: 23, ENTER: 66, BACK: 4, PREV: 88, NEXT: 87, PLAY: 85 };
const isCenter = k => k === K.CENTER || k === K.ENTER;

// ───────────────────────── host (what the app gives a game) ─────────────────────────
let audioCtx = null;
const host = {
  t, best: id => (store.get('best', {})[id] || 0),
  submitScore(id, score) {
    const b = store.get('best', {});
    if (score > (b[id] || 0)) { b[id] = score; store.set('best', b); renderList(); return true; }
    return false;
  },
  feedback() { // the Y1's click
    if (!document.getElementById('sound').checked) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), now = audioCtx.currentTime;
      o.type = 'square'; o.frequency.value = 1800;
      g.gain.setValueAtTime(0.05, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.018);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now + 0.02);
    } catch (e) {}
  },
  exitGame() { closeGame(); },
  library: () => LIB.songs || []
};

// ───────────────────────── GameView (base of every game) ─────────────────────────
const READY = 0, PLAYING = 1, PAUSED = 2, OVER = 3;
class Game {
  constructor() { this.state = READY; this.score = 0; this.newRecord = false; this.reset(); }
  cannotPlay() { return null; }
  onStarted() {}
  onPause() {}
  onLeave() {}
  overTitle() { return t('Game Over'); }
  scoreText() { return fmt('Score: %d', this.score); }
  bestText() { return fmt('Best: %d', host.best(this.id)); }
  handleKey(key, repeat) {
    if (key === K.BACK) {
      if (repeat) return;
      host.feedback();
      if (this.state === PLAYING) this.pause(); else host.exitGame();
      return;
    }
    if (this.state === PLAYING) { this.onGameKey(key, repeat); return; }
    if (!isCenter(key) || repeat) return;
    if (this.state === PAUSED) { host.feedback(); this.state = PLAYING; this.onResume && this.onResume(); }
    else if (this.cannotPlay() == null) {
      host.feedback();
      if (this.state === OVER) this.reset();
      this.score = 0; this.newRecord = false;
      this.onStarted();
      if (this.state !== OVER) this.state = PLAYING;
    }
  }
  pause() { if (this.state !== PLAYING) return; this.state = PAUSED; this.onPause(); }
  gameOver() { this.state = OVER; this.newRecord = host.submitScore(this.id, this.score); this.onPause(); }
  click(x, y) { this.handleKey(K.CENTER, false); }
  draw() {
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    this.drawGame();
    if (this.state === PLAYING) return;
    ctx.fillStyle = 'rgba(0,0,0,0.69)'; ctx.fillRect(0, 0, W, H);
    let title, lines;
    if (this.state === PAUSED) { title = t('Paused'); lines = [t('Center: resume'), t('Back: leave')]; }
    else if (this.state === OVER) {
      title = this.overTitle();
      lines = [this.scoreText(), this.newRecord ? t('New record!') : this.bestText(), '', t('Center: play again'), t('Back: leave')];
    } else {
      title = ''; const reason = this.cannotPlay(), b = host.best(this.id);
      lines = this.instructions().slice();
      if (reason != null) lines.push(...wrap(reason, 16, 440));
      else lines.push(b > 0 ? this.bestText() : '', '', t('Center: start'));
    }
    const titleSize = 30, lineSize = 16, gap = 6;
    let total = (title ? titleSize + 10 : 0) + lines.length * (lineSize + gap), y = (H - total) / 2;
    if (title) { y += titleSize; txt(ellipsize(title, titleSize, true, 460), W / 2, y, titleSize, '#FFFFFF', true, 'center'); y += 10; }
    for (const line of lines) { y += lineSize; txt(line, W / 2, y, lineSize, line === t('New record!') ? '#FFD60A' : '#E6E6E6', false, 'center'); y += gap; }
  }
  hud(left, right) {
    txt(left, 8, 17, 15, P.text, true, 'left');
    if (right != null) txt(right, W - 8, 17, 15, P.text2, true, 'right');
  }
}
function wrap(s, size, max) {
  ctx.font = font(size, false); const out = []; let line = '';
  for (const w of s.split(' ')) { const tryL = line ? line + ' ' + w : w; if (ctx.measureText(tryL).width > max && line) { out.push(line); line = w; } else line = tryL; }
  if (line) out.push(line); return out;
}

// ───────────────────────── Bricks ─────────────────────────
class Bricks extends Game {
  get id() { return 'bricks'; }
  instructions() { return [t('Wheel: move the paddle'), t('Center: launch the ball')]; }
  reset() {
    this.COLS = 8; this.ROWS = 5; this.margin = 8; this.wallTop = 26; this.brickTop = 46; this.brickH = 15;
    this.brickW = (W - 16) / 8; this.paddleW = 76; this.paddleH = 8; this.paddleY = H - 22; this.paddleX = W / 2;
    this.r = 6; this.lives = 3; this.level = 1; this.speed = 230; this.lastMove = 0; this.fill(); this.stuck = true;
    this.ballX = this.paddleX; this.ballY = this.paddleY - this.r - 1;
  }
  fill() { this.bricks = Array.from({ length: 5 }, () => Array(8).fill(true)); }
  onGameKey(key) {
    if (key === K.LEFT || key === K.PREV || key === K.RIGHT || key === K.NEXT) {
      const now = performance.now(), step = now - this.lastMove < 90 ? 34 : 20; this.lastMove = now;
      this.paddleX = clamp(this.paddleX + (key === K.LEFT || key === K.PREV ? -step : step), this.paddleW / 2, W - this.paddleW / 2);
    } else if (this.stuck && (isCenter(key) || key === K.PLAY)) {
      this.stuck = false; const a = (-20 + Math.random() * 40) * Math.PI / 180;
      this.vx = this.speed * Math.sin(a); this.vy = -this.speed * Math.cos(a);
    }
  }
  update(dt) {
    if (this.stuck) { this.ballX = this.paddleX; this.ballY = this.paddleY - this.r - 1; return; }
    const steps = Math.ceil(this.speed * dt / 3);
    for (let i = 0; i < steps && this.state === PLAYING && !this.stuck; i++) this.move(dt / steps);
  }
  move(dt) {
    const r = this.r, px = this.ballX, py = this.ballY;
    this.ballX += this.vx * dt; this.ballY += this.vy * dt;
    if (this.ballX < r) { this.ballX = r; this.vx = Math.abs(this.vx); } else if (this.ballX > W - r) { this.ballX = W - r; this.vx = -Math.abs(this.vx); }
    if (this.ballY < this.wallTop + r) { this.ballY = this.wallTop + r; this.vy = Math.abs(this.vy); }
    if (this.vy > 0 && this.ballY + r >= this.paddleY && py + r <= this.paddleY + this.paddleH && Math.abs(this.ballX - this.paddleX) <= this.paddleW / 2 + r) {
      const rel = clamp((this.ballX - this.paddleX) / (this.paddleW / 2), -1, 1), a = rel * 60 * Math.PI / 180;
      this.vx = this.speed * Math.sin(a); this.vy = -this.speed * Math.cos(a); this.ballY = this.paddleY - r;
    }
    const col = Math.floor((this.ballX - this.margin) / this.brickW), row = Math.floor((this.ballY - this.brickTop) / this.brickH);
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr_ = row + dr, cc = col + dc;
      if (rr_ < 0 || rr_ >= this.ROWS || cc < 0 || cc >= this.COLS || !this.bricks[rr_][cc]) continue;
      const l = this.margin + cc * this.brickW, tp = this.brickTop + rr_ * this.brickH;

      if (i === this.choice && this.state === PLAYING) { ctx.strokeStyle = P.accent; ctx.lineWidth = 3; rr(l, top, cardW, cardH, 8); ctx.stroke(); }
      const size = 130, cx = l + cardW / 2, cy = top + 10;
      drawCover(s.p, cx - size / 2, cy, size);
      txt(ellipsize(s.t, 15, true, cardW - 16), cx, cy + size + 22, 15, P.text, true, 'center');
      txt(ellipsize(s.a, 13, false, cardW - 16), cx, cy + size + 40, 13, P.text2, false, 'center');
      if (this.revealed) txt(String(this.years[i]), cx, cy + size + 70, 24, this.years[i] < this.years[1 - i] ? '#30D158' : '#FF453A', true, 'center');
    }
  }
}

// ───────────────────────── Music Quiz ─────────────────────────
// As on the Y1: 5 rounds of 8 questions, 3 lives, 10 s each. A clip of the song plays (from 20-70 % in) and
// the question is about its title, artist, album, year, genre or album cover. $100 per right answer.
const QT = { TITLE: 0, ARTIST: 1, ALBUM: 2, YEAR: 3, GENRE: 4, COVER: 5 };
const QUIZ_TIME = 10, PER_ROUND = 8, ROUNDS = 5;
class Quiz extends Game {
  get id() { return 'quiz'; }
  instructions() { return [t('Listen to the clip and pick the answer'), t('5 rounds of 8 questions, 3 lives.')]; }
  pool() {
    return this._pool || (this._pool = host.library().filter(s => !/\/(Audiobooks|Podcasts)\//.test('/' + s.p) && s.t && s.t.trim()));
  }
  cannotPlay() {
    if (!LIB.songs) return t(LIB.loading ? 'Loading your music...' : 'Open this page from the Y1\'s web server to play with your music.');
    return this.pool().length < 4 ? t('Not enough songs in your library for Music Quiz.') : null;
  }
  scoreText() { return t('Score') + ': $' + (this.score * 100).toLocaleString('en-US'); }
  bestText() { return t('Best') + ': $' + (host.best(this.id) * 100).toLocaleString('en-US'); }
  overTitle() { return this.won ? t('You beat all 5 rounds!') : t('Game Over!'); }
  reset() { this.lives = 3; this.round = 1; this.q = 0; this.phase = 'q'; this.options = []; this.won = false; this.stopClip(); }
  onStarted() { this.lives = 3; this.round = 1; this.q = 0; this.won = false; this.next(); }
  field(s, type) {
    switch (type) {
      case QT.ARTIST: return (s.a || '').trim(); case QT.ALBUM: case QT.COVER: return (s.al || '').trim();
      case QT.YEAR: { const y = yearOf(s); return y ? String(y) : ''; } case QT.GENRE: return (s.g || '').trim();
      default: return (s.t || '').trim();
    }
  }
  distinct(type) { return new Set(this.pool().map(s => this.field(s, type).toLowerCase()).filter(Boolean)).size; }
  next() {
    if (this.q >= PER_ROUND) {
      if (this.round >= ROUNDS) { this.won = true; this.stopClip(); this.gameOver(); return; }
      this.phase = 'round'; this.stopClip(); this.options = [t('Continue')]; this.focus = 0; return;
    }
    this.q++; this.phase = 'q'; this.answered = false; this.result = null; this.focus = 0;
    const types = [QT.TITLE];
    for (const ty of [QT.ARTIST, QT.ALBUM, QT.YEAR, QT.GENRE]) if (this.distinct(ty) >= 4) types.push(ty);
    if (this.distinct(QT.COVER) >= 3) types.push(QT.COVER);
    this.type = types[rnd(types.length)];
    let pool = this.pool().filter(s => this.field(s, this.type)); if (!pool.length) pool = this.pool();
    this.correct = pool[rnd(pool.length)]; this.correctText = this.field(this.correct, this.type);
    const title = '“' + this.correct.t + '”';
    this.prompt = { [QT.ARTIST]: fmt('Which artist released %s?', title), [QT.ALBUM]: fmt('Which album is %s from?', title),
      [QT.YEAR]: fmt('What year was %s released?', title), [QT.GENRE]: fmt('What genre is %s?', title),
      [QT.COVER]: t("Which cover matches this song's album?") }[this.type] || t('What song is playing?');
    if (this.type === QT.COVER) { // three covers of different albums
      const reps = new Map(); for (const s of shuffle(pool.slice())) { const k = this.field(s, QT.COVER).toLowerCase(); if (!reps.has(k)) reps.set(k, s); }
      const opts = [this.correct];
      for (const s of reps.values()) { if (opts.length >= 3) break; if (!opts.some(o => this.field(o, QT.COVER).toLowerCase() === this.field(s, QT.COVER).toLowerCase())) opts.push(s); }
      this.options = shuffle(opts); this.options.forEach(s => cover(s.p));
    } else {
      const opts = [this.correctText];
      for (const s of shuffle(pool.slice())) { if (opts.length >= 4) break; const v = this.field(s, this.type); if (v && !opts.some(o => o.toLowerCase() === v.toLowerCase())) opts.push(v); }
      while (opts.length < 4 && pool.length) opts.push(this.field(pool[rnd(pool.length)], this.type));
      this.options = shuffle(opts);
    }
    this.timeLeft = QUIZ_TIME; this.timerOn = false; this.playClip(this.correct);
  }
  playClip(song) {
    this.stopClip();
    const a = new Audio('/api/file?path=' + encodeURIComponent(song.p)); this.audio = a; a.loop = true;
    a.addEventListener('loadedmetadata', () => {
      const d = a.duration || 0;
      if (d > 20) { const maxStart = d - 12; a.currentTime = maxStart * 0.2 + Math.random() * Math.max(1, maxStart * 0.5); }
    });
    a.addEventListener('playing', () => { if (this.audio === a) this.timerOn = true; });
    a.play().catch(() => {});
    this.clipWait = 4; // over slow Wi-Fi the clock starts when the clip does (at the latest after 4 s)
  }
  stopClip() { if (this.audio) { try { this.audio.pause(); this.audio.src = ''; } catch (e) {} this.audio = null; } }
  onPause() { if (this.audio) this.audio.pause(); }
  onResume() { if (this.audio && this.phase === 'q' && !this.answered) this.audio.play().catch(() => {}); }
  onLeave() { this.stopClip(); }
  choose(i) {
    if (this.phase === 'round') { host.feedback(); this.round++; this.q = 0; this.next(); return; }
    if (this.answered) return;
    host.feedback(); this.answered = true; this.stopClip(); this.focus = i;
    const sel = i == null ? null : this.type === QT.COVER ? this.field(this.options[i], QT.COVER) : this.options[i];
    const ok = sel != null && sel.toLowerCase() === (this.correctText || '').toLowerCase();
    if (ok) this.score++; else this.lives--;
    this.result = ok; this.resultTimer = 1.2;
  }
  onGameKey(key, repeat) {
    const n = this.options.length;
    if (key === K.LEFT || key === K.PREV) this.focus = (this.focus - 1 + n) % n;
    else if (key === K.RIGHT || key === K.NEXT) this.focus = (this.focus + 1) % n;
    else if (isCenter(key) && !repeat) this.choose(this.focus);
  }
  update(dt) {
    if (this.phase !== 'q') return;
    if (this.answered) { this.resultTimer -= dt; if (this.resultTimer <= 0) { if (this.lives <= 0) this.gameOver(); else this.next(); } return; }
    if (!this.timerOn) { this.clipWait -= dt; if (this.clipWait <= 0) this.timerOn = true; return; }
    this.timeLeft -= dt; if (this.timeLeft <= 0) { this.timeLeft = 0; this.choose(null); }
  }
  optionRects() {
    if (this.phase === 'q' && this.type === QT.COVER) { const w = (W - 48) / 3; return this.options.map((_, i) => [12 + i * (w + 12), 96, w, 244]); }
    return this.options.map((_, i) => [24, 100 + i * 60, W - 48, 50]);
  }
  click(x, y) {
    if (this.state !== PLAYING) return super.click(x, y);
    this.optionRects().forEach((r, i) => { if (x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]) this.choose(i); });
  }
  drawGame() {
    txt('$' + (this.score * 100).toLocaleString('en-US'), 8, 17, 15, P.text, true);
    txt(fmt('Round %d', this.round) + '  ·  ' + Math.max(1, this.q) + '/' + PER_ROUND, W / 2, 17, 15, P.text2, true, 'center');
    let hearts = ''; for (let i = 0; i < 3; i++) hearts += (i < this.lives ? '♥' : '♡') + (i < 2 ? ' ' : '');
    txt(hearts, W - 8, 17, 15, '#FF453A', true, 'right');
    fillRR(8, 26, W - 8, 30, 2, alpha(P.text, 0.12));
    if (this.phase === 'q' && this.state !== READY) fillRR(8, 26, 8 + (W - 16) * (this.timeLeft / QUIZ_TIME), 30, 2, P.accent);
    if (this.state === READY || !this.options.length) return;
    let prompt = this.prompt;
    if (this.phase === 'round') prompt = fmt('Round %d Complete!', this.round);
    else if (this.answered) prompt = this.result ? '✓ ' + t('Correct!') : '✕ ' + t('It was: ') + this.correctText;
    const col = this.phase === 'q' && this.answered ? (this.result ? '#30D158' : '#FF453A') : P.text;
    wrap(prompt, 17, W - 40).slice(0, 2).forEach((line, i, arr) => txt(i === 1 && arr.length > 1 ? ellipsize(line, 17, true, W - 40) : line, W / 2, (arr.length > 1 ? 52 : 62) + i * 22, 17, col, true, 'center'));
    const rects = this.optionRects();
    rects.forEach((r, i) => {
      const [x, y, w, h] = r, focused = i === this.focus;
      let fill = focused ? P.accent : alpha(P.text, 0.08), fg = focused ? '#FFFFFF' : P.text;
      if (this.phase === 'q' && this.answered) {
        const v = this.type === QT.COVER ? this.field(this.options[i], QT.COVER) : this.options[i];
        if (v.toLowerCase() === this.correctText.toLowerCase()) { fill = '#30D158'; fg = '#FFFFFF'; }
        else if (focused) { fill = '#FF453A'; fg = '#FFFFFF'; }
      }
      if (this.phase === 'q' && this.type === QT.COVER) {
        fillRR(x, y, x + w, y + h, 12, fill);
        const s = Math.min(w - 12, h - 12); drawCover(this.options[i].p, x + (w - s) / 2, y + (h - s) / 2, s);
      } else {
        fillRR(x, y, x + w, y + h, h / 2, fill);
        if (focused) circle(x + 22, y + h / 2, 6, fg);
        txt(ellipsize(this.options[i], 17, true, w - 60), x + 40, y + h / 2 + 6, 17, fg, true);
      }
    });
  }
}

// ───────────────────────── the games list (as on the Y1: Extras > Games) ─────────────────────────
const GAMES = [
  { id: 'quiz', name: 'Music Quiz', em: '🎵', make: () => new Quiz(), music: true },
  { id: 'bricks', name: 'Bricks', em: '🧱', make: () => new Bricks() },
  { id: 'snake', name: 'Snake', em: '🐍', make: () => new Snake() },
  { id: 'simon', name: 'Simon', em: '🔴', make: () => new Simon() },
  { id: 'blocks', name: 'Blocks', em: '🟦', make: () => new Blocks() },
  { id: 'flappy', name: 'Flappy', em: '🐤', make: () => new Flappy() },
  { id: 'older', name: 'Which Came First?', em: '📅', make: () => new Older(), music: true }
];
let menuIndex = store.get('menu', 0) % GAMES.length, game = null;
const LIB = { songs: null, loading: false };

function openGame(i) {
  if (game) game.onLeave();
  menuIndex = i; store.set('menu', i);
  game = GAMES[i].make(); renderList();
}
function closeGame() { if (game) game.onLeave(); game = null; renderList(); }

function menuKey(key, repeat) {
  if (key === K.LEFT || key === K.PREV) { menuIndex = (menuIndex - 1 + GAMES.length) % GAMES.length; host.feedback(); renderList(); }
  else if (key === K.RIGHT || key === K.NEXT) { menuIndex = (menuIndex + 1) % GAMES.length; host.feedback(); renderList(); }
  else if (isCenter(key) && !repeat) { host.feedback(); openGame(menuIndex); }
}
function drawMenu() { // a classic Y1 list: title bar, rows on the left, a card on the right
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  txt(t('Games'), 10, 21, 17, P.text, true);
  ctx.fillStyle = alpha(P.text2, 0.4); ctx.fillRect(0, 30, W, 1);
  const rowH = 38, top = 38;
  GAMES.forEach((g, i) => {
    const y = top + i * rowH, on = i === menuIndex;
    if (on) fillRR(4, y, 236, y + rowH - 4, 8, P.accent);
    txt(ellipsize(t(g.name), 20, false, 200), 14, y + 24, 20, on ? '#FFFFFF' : P.text, false);
    if (on) txt('›', 226, y + 24, 22, '#FFFFFF', true, 'right');
  });
  const g = GAMES[menuIndex], cx = 362;
  fillRR(250, 40, 474, 352, 14, alpha(P.text, 0.07));
  ctx.font = '64px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = P.text; ctx.fillText(g.em, cx, 150);
  wrap(t(g.name), 20, 200).slice(0, 2).forEach((l, i) => txt(l, cx, 196 + i * 24, 20, P.text, true, 'center'));
  const b = host.best(g.id);
  if (b > 0) txt(g.id === 'quiz' ? t('Best') + ': $' + (b * 100).toLocaleString('en-US') : fmt('Best: %d', b), cx, 256, 15, P.text2, false, 'center');
  if (g.music && !LIB.songs) wrap(t('The music games use your Y1\'s songs: open this page from its web server.'), 12, 200).slice(0, 4).forEach((l, i) => txt(l, cx, 284 + i * 16, 12, P.text2, false, 'center'));
  else txt(t('Center: start'), cx, 330, 13, P.text2, false, 'center');
}

// ───────────────────────── input ─────────────────────────
function press(key, repeat) {
  if (game) game.handleKey(key, !!repeat); else menuKey(key, !!repeat);
}
const KEYMAP = { ArrowLeft: K.LEFT, ArrowUp: K.LEFT, ArrowRight: K.RIGHT, ArrowDown: K.RIGHT, Enter: K.CENTER, ' ': K.CENTER,
  Escape: K.BACK, Backspace: K.BACK, a: K.PREV, A: K.PREV, d: K.NEXT, D: K.NEXT, s: K.PLAY, S: K.PLAY };
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && e.key !== 'Escape') return;
  const k = KEYMAP[e.key]; if (k == null) return;
  e.preventDefault(); press(k, e.repeat);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && game) game.pause(); });
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (game) { game.click(x, y); return; }
  const i = Math.floor((y - 38) / 38);
  if (x < 240 && i >= 0 && i < GAMES.length) { if (i === menuIndex) openGame(i); else { menuIndex = i; host.feedback(); renderList(); } }
  else if (x >= 250) openGame(menuIndex);
});

// the click wheel: drag around it to spin (one step per 15°), click its four sides, mouse wheel spins too
(function wheel() {
  const svg = document.getElementById('wheel'), ring = document.getElementById('ring'), hit = document.getElementById('hit'), centerBtn = document.getElementById('centerBtn');
  const pt = e => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) * 260 / r.width - 130, (e.clientY - r.top) * 260 / r.height - 130]; };
  const ang = p => Math.atan2(p[1], p[0]) * 180 / Math.PI;
  let drag = null;
  const flash = zone => { // highlight the pressed side
    const a0 = { right: -45, bottom: 45, left: 135, top: 225 }[zone], R = 126, r = 50, rad = d => d * Math.PI / 180;
    const p = (rr_, d) => (130 + rr_ * Math.cos(rad(d))).toFixed(1) + ',' + (130 + rr_ * Math.sin(rad(d))).toFixed(1);
    hit.setAttribute('d', `M${p(r, a0)} L${p(R, a0)} A${R},${R} 0 0 1 ${p(R, a0 + 90)} L${p(r, a0 + 90)} A${r},${r} 0 0 0 ${p(r, a0)}Z`);
    hit.classList.add('on'); clearTimeout(flash.t); flash.t = setTimeout(() => hit.classList.remove('on'), 140);
  };
  ring.addEventListener('pointerdown', e => {
    e.preventDefault(); ring.setPointerCapture(e.pointerId); ring.classList.add('drag');
    drag = { last: ang(pt(e)), acc: 0, moved: false, p: pt(e) };
  });
  ring.addEventListener('pointermove', e => {
    if (!drag) return;
    const a = ang(pt(e)); let d = a - drag.last; if (d > 180) d -= 360; if (d < -180) d += 360;
    drag.last = a; drag.acc += d;
    while (Math.abs(drag.acc) >= 15) { drag.moved = true; const cw = drag.acc > 0; drag.acc -= cw ? 15 : -15; press(cw ? K.RIGHT : K.LEFT, false); }
  });
  const end = e => {
    if (!drag) return; ring.classList.remove('drag');
    if (!drag.moved) {
      const p = drag.p, a = (ang(p) + 360) % 360;
      const zone = a >= 315 || a < 45 ? 'right' : a < 135 ? 'bottom' : a < 225 ? 'left' : 'top';
      flash(zone); press({ right: K.NEXT, bottom: K.PLAY, left: K.PREV, top: K.BACK }[zone], false);
    }
    drag = null;
  };
  ring.addEventListener('pointerup', end); ring.addEventListener('pointercancel', () => { drag = null; ring.classList.remove('drag'); });
  centerBtn.addEventListener('pointerdown', e => { e.preventDefault(); press(K.CENTER, false); });
  let wheelAcc = 0;
  svg.addEventListener('wheel', e => { e.preventDefault(); wheelAcc += e.deltaY; while (Math.abs(wheelAcc) >= 40) { press(wheelAcc > 0 ? K.RIGHT : K.LEFT, false); wheelAcc -= Math.sign(wheelAcc) * 40; } }, { passive: false });
})();

// ───────────────────────── side panel ─────────────────────────
function renderList() {
  const el = document.getElementById('list'); el.innerHTML = '';
  GAMES.forEach((g, i) => {
    const b = document.createElement('button'), best = host.best(g.id);
    if ((game ? GAMES.findIndex(x => x.id === game.id) : menuIndex) === i) b.className = 'on';
    const em = document.createElement('span'); em.className = 'em'; em.textContent = g.em;
    const name = document.createElement('span'); name.textContent = t(g.name);
    const small = document.createElement('small');
    small.textContent = best > 0 ? (g.id === 'quiz' ? t('Record') + ': $' + (best * 100).toLocaleString('en-US') : t('Record') + ': ' + best) : ' ';
    name.appendChild(small); b.append(em, name);
    b.onclick = () => { openGame(i); cv.focus && cv.focus(); };
    el.appendChild(b);
  });
}
function renderStatic() {
  document.querySelectorAll('[data-t]').forEach(el => {
    const em = el.textContent.match(/^\S+\s/); const word = t(el.dataset.t);
    el.textContent = el.closest('.nav') && em ? em[0] + word : word;
  });
  document.getElementById('intro').textContent = t('Web versions of InniClassic\'s mini-games, to try them on the computer. They play like on the Y1: same rules, same buttons.');
  const rows = [
    [t('Wheel'), ['←', '→'], t('or spin the wheel / mouse wheel')],
    [t('Center button'), ['Intro', 'Espacio'], t('or click the screen')],
    [t('Back (MENU)'), ['Esc', '⌫']],
    [t('Previous') + ' ⏮', ['A']], [t('Next') + ' ⏭', ['D']], [t('Play/Pause') + ' ⏯', ['S']]
  ];
  const tb = document.getElementById('keys'); tb.innerHTML = '';
  for (const [label, keys, note] of rows) {
    const tr = tb.insertRow(), a = tr.insertCell(), b = tr.insertCell(); a.textContent = label;
    keys.forEach(k => { const kb = document.createElement('kbd'); kb.textContent = LANG_ES ? k : k.replace('Intro', 'Enter').replace('Espacio', 'Space'); b.appendChild(kb); });
    if (note) { const s = document.createElement('div'); s.style.cssText = 'color:var(--dim);font-size:12px;margin-top:2px'; s.textContent = note; b.appendChild(s); }
  }
  const sel = document.getElementById('palette'); sel.innerHTML = '';
  for (const [k, p] of Object.entries(PALETTES)) { const o = new Option(t(p.name), k); o.selected = p === P; sel.add(o); }
  sel.onchange = () => { P = PALETTES[sel.value]; store.set('palette', sel.value); sel.blur(); };
  const snd = document.getElementById('sound'); snd.checked = store.get('sound', true); snd.onchange = () => { store.set('sound', snd.checked); snd.blur(); };
}
function setMusicNote(text, ok) { const n = document.getElementById('musicNote'); n.textContent = text; n.className = 'musicnote' + (ok ? ' ok' : ''); }

// ───────────────────────── the Y1's library (only when served by its web server) ─────────────────────────
async function loadLibrary() {
  if (!/^http:$/.test(location.protocol)) { setMusicNote(t('The music games use your Y1\'s songs: open this page from its web server.')); return; }
  LIB.loading = true; setMusicNote(t('Loading your music...'));
  try {
    const c = new AbortController(), timer = setTimeout(() => c.abort(), 15000);
    const r = await fetch('/api/library', { signal: c.signal }); clearTimeout(timer);
    if (!r.ok) throw new Error(r.status);
    const songs = await r.json(); if (!Array.isArray(songs)) throw new Error('format');
    LIB.songs = songs; document.getElementById('nav').hidden = false;
    setMusicNote(fmt('Playing with your Y1\'s music (%d songs).', songs.length), true);
  } catch (e) {
    setMusicNote(t('The music games use your Y1\'s songs: open this page from its web server.'));
  }
  LIB.loading = false;
}

// ───────────────────────── loop ─────────────────────────
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  fitCanvas();
  if (game) { if (game.state === PLAYING) game.update(dt); game.draw(); } else drawMenu();
  requestAnimationFrame(loop);
}
renderStatic(); renderList(); loadLibrary();
requestAnimationFrame(loop);
</script>
